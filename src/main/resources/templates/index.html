<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동네 기반 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5a9cc8fe6f58844aafaa5b7e9a482c0b"></script>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-gray-100">

    <div id="map" class="w-full h-full absolute inset-0 z-0">
        <div class="w-full h-full bg-slate-200 flex items-center justify-center text-gray-500">
            지도 영역 (카카오맵 API 키 입력 시 실제 지도로 전환됩니다)
        </div>
    </div>

    <div class="absolute bottom-6 left-6 z-10 w-80 h-96 bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200/50 p-4 flex flex-col">
        <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">📌 동네 게시판</h2>
        <div class="flex-1 overflow-y-auto space-y-2 pr-1">
            <div class="p-2.5 bg-gray-50 rounded-xl text-sm text-gray-600 hover:bg-gray-100 cursor-pointer transition">🔥 현재 핫한 주변 피드 보기</div>
            <div class="p-2.5 bg-gray-50 rounded-xl text-sm text-gray-600 hover:bg-gray-100 cursor-pointer transition">📍 우리 동네 맛집 공유해요</div>
        </div>
    </div>

    <div class="absolute bottom-6 right-6 z-10 w-72 h-80 bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200/50 p-4 flex flex-col">
        <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">💌 쪽지함</h2>
        <div class="flex-1 flex items-center justify-center text-sm text-gray-400">새로운 쪽지가 없습니다.</div>
    </div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10">
        <button class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-full text-white text-3xl font-light shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center justify-center group">
            <span class="transition-transform duration-300 group-hover:rotate-90">+</span>
        </button>
    </div>

    <script>
        window.onload = function() {
            var container = document.getElementById('map');
            if (container && typeof kakao !== 'undefined' && kakao.maps) {
                var options = {
                    center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 시청 기준
                    level: 3
                };
                var map = new kakao.maps.Map(container, options);
            }
        };
    </script>
</body>
</html>
